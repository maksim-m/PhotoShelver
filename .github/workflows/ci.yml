# Every push to main and every pull request: build with warnings as errors, the core tests, the UI tests (the real
# window, driven through UI Automation), the published exe started once (smoke test) and kept as a downloadable
# artifact. Also run by release.yml before a release is made.
# Also the tests on exFAT volumes (virtual disks created on the runner). Not here: the mutation check
# (long; see mutation.yml).
name: CI

on:
  push:
    branches: [main, "compat/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      for-release:
        description: "Called by release.yml: the release makes its own exe, none is kept here"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    # windows-2022 (Server 2022, build 20348): a Windows before 11, the closest GitHub has to Windows 10 (no Mica,
    # maybe no Segoe Fluent Icons): the app must work and look right there too.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # Actions are pinned to a commit (a tag can be moved); the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (exactly the versions in packages.lock.json)
        run: dotnet restore --locked-mode

      # Debug, like local runs and the sandbox (the UI tests start the app from bin\Debug).
      - name: Build
        id: build
        run: dotnet build --no-restore -c Debug

      - name: Core tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >
          dotnet test tests/PhotoShelver.Core.Tests --no-build -c Debug --blame-hang-timeout 5m
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults/core

      - name: UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PHOTOSHELVER_UI_TESTS: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >
          dotnet test tests/PhotoShelver.UiTests --no-build -c Debug --blame-hang-timeout 5m
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults/ui

      # Like SD cards: two exFAT virtual disks, one write-protected. The runner is a disposable VM with administrator
      # rights, as Windows Sandbox is locally (tools/run_tests_sandbox.ps1 uses the same script).
      - name: Test volumes (exFAT, one write-protected)
        id: volumes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          powershell -ExecutionPolicy Bypass -File tools/create_test_volumes.ps1
          -Fixtures tests/PhotoShelver.Core.Tests/Fixtures/media -Folder "${{ runner.temp }}/volumes"

      - name: Volume tests (core)
        if: ${{ !cancelled() && steps.volumes.outcome == 'success' }}
        env:
          PHOTOSHELVER_TEST_VOLUME: 'X:\'
          PHOTOSHELVER_TEST_READONLY_VOLUME: 'Y:\'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >
          dotnet test tests/PhotoShelver.Core.Tests --no-build -c Debug --filter "Category=RealVolume" --blame-hang-timeout 5m
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults/volumes-core

      - name: Volume tests (UI)
        if: ${{ !cancelled() && steps.volumes.outcome == 'success' }}
        env:
          PHOTOSHELVER_UI_TESTS: "1"
          PHOTOSHELVER_TEST_VOLUME: 'X:\'
          PHOTOSHELVER_TEST_READONLY_VOLUME: 'Y:\'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >
          dotnet test tests/PhotoShelver.UiTests --no-build -c Debug --filter "Category=RealVolumeUi" --blame-hang-timeout 5m
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults/volumes-ui

      - name: Test results and UI screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults
            ${{ runner.temp }}/PhotoShelverUiTests/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      # Restores again for Release (the self-contained runtime), still in locked mode.
      - name: Publish the exe
        run: dotnet publish src/PhotoShelver.App -c Release -o publish -p:RestoreLockedMode=true

      # The tests above use the Debug build; this starts the exe exactly as it would be shipped.
      - name: Smoke test of the exe
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: powershell -ExecutionPolicy Bypass -File tools/smoke_test_exe.ps1 -Exe publish/PhotoShelver.exe

      # How the app looks on this Windows: a demo card and library (drawn pictures), in the light and the dark theme.
      - name: Screenshots
        if: ${{ !cancelled() && !inputs.for-release }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          [Environment]::OSVersion.VersionString
          "Segoe Fluent Icons installed: $(Test-Path "$env:WINDIR\Fonts\SegoeIcons.ttf")"
          python -m pip install --quiet pillow
          python tools/make_demo_library.py "${{ runner.temp }}/demo"
          foreach ($theme in 'Light', 'Dark') {
            powershell -ExecutionPolicy Bypass -File tools/screenshot_exe.ps1 -Exe publish/PhotoShelver.exe `
              -Demo "${{ runner.temp }}/demo" -Out "screenshots/$theme.png" -Theme $theme
            if ($LASTEXITCODE -ne 0) { throw "screenshot $theme failed" }
          }

      - name: Upload the screenshots
        if: ${{ !cancelled() && !inputs.for-release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore

      # The exe is the same on every Windows: kept once.
      - if: ${{ !inputs.for-release && matrix.os == 'windows-2025' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhotoShelver-${{ github.sha }}
          path: publish/PhotoShelver.exe
          retention-days: 14
          if-no-files-found: error
