# A release from a version tag:
#   git tag v1.2.0 && git push origin v1.2.0          (a pre-release: v1.3.0-beta.1)
# 1. All CI checks (ci.yml): build, core tests, UI tests.
# 2. The exe is built with the tag's version, started once (smoke test), and its SHA-256 written next to it.
# 3. A GitHub Release with the exe and SHA256SUMS.txt; the notes are generated from the commits since the last release.
# Only tags on main are released. The exe is not signed (yet): Windows SmartScreen warns when a downloaded copy is
# started for the first time.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      for-release: true

  release:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to check that the tag is on main

      - name: Version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3 or v1.2.3-beta.1 (semantic versioning); anything else is not a release tag.
          if ($env:TAG -notmatch '^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "'$env:TAG' is not a version tag (v1.2.3 or v1.2.3-beta.1)"
          }
          $numeric = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          "version=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($Matches[4]) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: The tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "the tagged commit is not on main: releases are made from main only" }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Version: the full one (1.2.3-beta.1) for the exe's product version and the import log, the numeric one for the
      # assembly and file version.
      - name: Publish the exe
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC: ${{ steps.version.outputs.numeric }}
        run: >
          dotnet publish src/PhotoShelver.App -c Release -o publish -p:RestoreLockedMode=true
          "-p:Version=$env:VERSION" "-p:AssemblyVersion=$env:NUMERIC.0" "-p:FileVersion=$env:NUMERIC.0"

      - name: Smoke test of the exe
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >
          powershell -ExecutionPolicy Bypass -File tools/smoke_test_exe.ps1 -Exe publish/PhotoShelver.exe
          -ExpectedVersion ${{ steps.version.outputs.version }}

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/PhotoShelver.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # The format of sha256sum: "Get-FileHash PhotoShelver.exe" or "sha256sum -c SHA256SUMS.txt" checks it.
          "$hash  PhotoShelver.exe" | Set-Content -Encoding ascii publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $flags = @("--verify-tag", "--generate-notes", "--title", "PhotoShelver $env:VERSION")
          if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
          gh release create $env:TAG publish/PhotoShelver.exe publish/SHA256SUMS.txt @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
